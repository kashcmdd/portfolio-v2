    <script>
      // Apply the saved theme before the first paint so a returning visitor
      // does not get a flash of the other palette.
      try {
        if (localStorage.getItem('v2-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch {}
    </script>
